name: Health checks

on:
  push:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # One entry point for a source checkout and a release; see scripts/ci.sh.
      - name: agentBrain CI
        run: bash scripts/ci.sh
